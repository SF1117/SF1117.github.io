<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF1117 的作品集</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f1115;color:#e8eaed;line-height:1.6}
  header{padding:64px 20px 32px;text-align:center}
  h1{font-size:2rem}
  header p{color:#9aa0a6;margin-top:8px}
  main{max-width:720px;margin:0 auto;padding:0 16px 48px}
  h2{margin:32px 0 16px;font-size:1.2rem;border-left:4px solid #4f8cff;padding-left:10px}
  .card{display:block;background:#1a1d24;border-radius:12px;padding:18px;margin-bottom:14px;color:inherit;text-decoration:none}
  .card h3{font-size:1.05rem}
  .card p{color:#9aa0a6;font-size:.9rem;margin-top:4px}
  .tag{display:inline-block;background:#26304a;color:#8ab4ff;border-radius:999px;padding:2px 10px;font-size:.75rem;margin-top:8px}
  footer{text-align:center;color:#9aa0a6;padding:24px;font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1>SF1117</h1>
  <p>一句话介绍你自己，比如：做视频、爱折腾的创作者</p>
</header>
<main>
  <h2>关于我</h2>
  <p>在这里写 2～3 句自我介绍：你做什么、擅长什么、想做什么。</p>

  <h2>我的作品</h2>
  <a class="card" href="https://example.com" target="_blank">
    <h3>作品一：标题</h3>
    <p>一句话说明这个作品是什么。</p>
    <span class="tag">视频</span>
  </a>
  <a class="card" href="https://example.com" target="_blank">
    <h3>作品二：标题</h3>
    <p>一句话说明这个作品是什么。</p>
    <span class="tag">剪辑</span>
  </a>
  <a class="card" href="https://example.com" target="_blank">
    <h3>作品三：标题</h3>
    <p>一句话说明这个作品是什么。</p>
    <span class="tag">其他</span>
  </a>

  <h2>联系我</h2>
  <p>邮箱：your@email.com</p>
</main>
<footer>© 2026 SF1117</footer>
</body>
</html>
